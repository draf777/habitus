<ng-template #rowContent>
  <ion-icon
    slot="start"
    aria-hidden="true"
    [name]="habit().icon || 'ellipse-outline'"
    [style.color]="habit().color"
    [color]="habit().color ? undefined : 'primary'"
  ></ion-icon>

  <ion-label>
    <h2>{{ habit().name }}</h2>
    @if (habit().type !== 'boolean') {
      <p>Ziel: {{ habit().goal }} {{ unit() }}</p>
    }
    @if (weeklyProgress(); as weekly) {
      <p>{{ weekly.done }} / {{ weekly.goal }}x diese Woche</p>
    }
  </ion-label>

  @if (habit().type === 'boolean') {
    <ion-button
      slot="end"
      fill="clear"
      size="small"
      [color]="value() === 1 ? 'primary' : 'medium'"
      (click)="onCheckedChange(value() !== 1)"
      [attr.aria-pressed]="value() === 1"
      [attr.aria-label]="habit().name + ' erledigt'"
    >
      <ion-icon slot="icon-only" [name]="value() === 1 ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
    </ion-button>
  } @else {
    <ion-button
      slot="end"
      class="habit-item__nudge"
      fill="clear"
      size="small"
      (click)="nudge(-1)"
      [attr.aria-label]="habit().name + ' verringern'"
    >
      <ion-icon slot="icon-only" name="remove-circle-outline"></ion-icon>
    </ion-button>

    <ion-input
      slot="end"
      class="habit-item__value"
      type="text"
      inputmode="decimal"
      [value]="value()"
      (ionChange)="onNumberChange($event.detail.value)"
      [attr.aria-label]="habit().name + ' Wert heute'"
    ></ion-input>

    <ion-button
      slot="end"
      class="habit-item__nudge"
      fill="clear"
      size="small"
      (click)="nudge(1)"
      [attr.aria-label]="habit().name + ' erhöhen'"
    >
      <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
    </ion-button>
  }
</ng-template>

@if (isMobile()) {
  <!-- Touch viewport: edit/delete are swipe actions, keeping the row itself compact. -->
  <ion-item-sliding #slidingItem>
    <ion-item lines="full">
      <ng-container [ngTemplateOutlet]="rowContent"></ng-container>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option
        color="medium"
        (click)="onSwipeEdit(slidingItem)"
        [attr.aria-label]="'Habit ' + habit().name + ' bearbeiten'"
      >
        <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
      </ion-item-option>
      <ion-item-option
        color="danger"
        (click)="onSwipeRemove(slidingItem)"
        [attr.aria-label]="'Habit ' + habit().name + ' löschen'"
      >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
} @else {
  <!-- Desktop (mouse): swiping isn't discoverable, so edit/delete stay as plain visible buttons. -->
  <ion-item lines="full">
    <ng-container [ngTemplateOutlet]="rowContent"></ng-container>

    <ion-button
      slot="end"
      fill="clear"
      color="medium"
      (click)="edit.emit()"
      [attr.aria-label]="'Habit ' + habit().name + ' bearbeiten'"
    >
      <ion-icon slot="icon-only" name="pencil-outline"></ion-icon>
    </ion-button>

    <ion-button
      slot="end"
      fill="clear"
      color="medium"
      (click)="remove.emit()"
      [attr.aria-label]="'Habit ' + habit().name + ' löschen'"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
  </ion-item>
}
