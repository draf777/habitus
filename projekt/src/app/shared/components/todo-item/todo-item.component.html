<ng-template #rowContent>
  <ion-checkbox
    slot="start"
    [checked]="todo().done"
    (ionChange)="toggled.emit()"
    [attr.aria-label]="todo().text + ' erledigt'"
  ></ion-checkbox>
  <ion-label class="ion-text-wrap todo-text" [class.todo-done]="todo().done" (click)="onLabelClick($event)">
    @if (dateLabel(); as label) {
      <p>{{ label }}</p>
    }
    <span [innerHTML]="linkedText()"></span>
  </ion-label>
</ng-template>

@if (isMobile()) {
  <!-- Touch viewport: delete is a swipe action, keeping the row itself compact; the reorder handle is
       always visible regardless, since dragging it starts a reorder without competing with the swipe. -->
  <ion-item-sliding #slidingItem>
    <ion-item lines="full">
      <ng-container [ngTemplateOutlet]="rowContent"></ng-container>
      <ion-reorder slot="end"></ion-reorder>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option
        color="danger"
        (click)="onSwipeRemove(slidingItem)"
        [attr.aria-label]="'Aufgabe ' + todo().text + ' löschen'"
      >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
} @else {
  <!-- Desktop (mouse): swiping isn't discoverable, so delete stays a plain visible button next to the reorder handle. -->
  <ion-item lines="full">
    <ng-container [ngTemplateOutlet]="rowContent"></ng-container>

    <ion-button
      slot="end"
      fill="clear"
      color="medium"
      (click)="remove.emit()"
      [attr.aria-label]="'Aufgabe ' + todo().text + ' löschen'"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
    <ion-reorder slot="end"></ion-reorder>
  </ion-item>
}
