<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Todos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Todos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-item lines="none">
      <ion-input
        placeholder="Neue Aufgabe für heute"
        autocomplete="off"
        [value]="newTodoText()"
        (ionInput)="newTodoText.set($event.detail.value ?? '')"
        (keyup.enter)="addTodo()"
        aria-label="Neue Aufgabe"
      ></ion-input>
      <ion-button
        slot="end"
        fill="clear"
        [disabled]="!newTodoText().trim()"
        (click)="addTodo()"
        aria-label="Aufgabe hinzufügen"
      >
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true">
    <ion-list-header>
      <ion-label>Offen</ion-label>
      <ion-note slot="end">{{ openTodos().length }}</ion-note>
    </ion-list-header>

    @for (todo of openTodos(); track todo.id) {
      <app-todo-item [todo]="todo" (toggled)="onToggle(todo)" (remove)="onRemove(todo)"></app-todo-item>
    } @empty {
      <ion-note class="empty-hint">Nichts mehr offen.</ion-note>
    }
  </ion-list>

  @if (doneTodos().length > 0) {
    <ion-list [inset]="true">
      <ion-list-header>
        <ion-label>Erledigt</ion-label>
        <ion-note slot="end">{{ doneTodos().length }}</ion-note>
      </ion-list-header>

      @for (todo of doneTodos(); track todo.id) {
        <app-todo-item [todo]="todo" (toggled)="onToggle(todo)" (remove)="onRemove(todo)"></app-todo-item>
      }
    </ion-list>
  }
</ion-content>
