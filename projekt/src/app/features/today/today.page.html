<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Heute</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="showForm.set(true)" aria-label="Neues Habit">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Heute</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-list-header>
      <ion-label>Deine Habits</ion-label>
      <ion-note slot="end">{{ doneCount() }} / {{ habits().length }}</ion-note>
    </ion-list-header>

    @for (habit of habits(); track habit.id) {
      <app-habit-item
        [habit]="habit"
        [value]="valueFor(habit.id)"
        (valueChange)="onValueChange(habit, $event)"
        (remove)="onDelete(habit)"
      ></app-habit-item>
    } @empty {
      <ion-item lines="none">
        <ion-label class="ion-text-wrap">Noch keine Habits. Leg dein erstes über das Plus oben an.</ion-label>
      </ion-item>
    }
  </ion-list>

  <ion-modal [isOpen]="showForm()" (didDismiss)="showForm.set(false)">
    <ng-template>
      <app-new-habit-form (save)="onSave($event)" (canceled)="showForm.set(false)"></app-new-habit-form>
    </ng-template>
  </ion-modal>
</ion-content>
